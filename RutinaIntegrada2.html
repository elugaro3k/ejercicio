<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplicación Integrada de Rutinas de Ejercicios</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 650px;
            width: 100%;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            margin-top: 20px;
        }
        h1 {
            color: #2c3e50;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.8rem;
        }
        
        .selector-group {
            margin-bottom: 25px;
            text-align: left;
            background: #eef2f5;
            padding: 15px 20px;
            border-radius: 8px;
            border-left: 5px solid #3498db;
        }
        .selector-group label {
            display: block;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 8px;
            font-size: 1rem;
        }
        .selector-group select {
            width: 100%;
            padding: 10px 12px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            background-color: white;
            color: #333;
            cursor: pointer;
            outline: none;
        }

        .phase {
            font-size: 1.2rem;
            font-weight: bold;
            color: #7f8c8d;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }
        .timer {
            font-size: 4.5rem;
            font-weight: bold;
            color: #2980b9;
            margin: 15px 0;
            font-variant-numeric: tabular-nums;
            transition: color 0.3s ease;
        }
        .timer.work { color: #e74c3c; }
        .timer.rest { color: #2ecc71; }
        
        .exercise-title {
            font-size: 1.7rem;
            color: #2c3e50;
            margin-bottom: 15px;
            font-weight: 600;
            min-height: 2.2rem;
        }
        .description {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #555;
            margin-bottom: 25px;
            text-align: left;
            background: #f9f9f9;
            padding: 15px;
            border-left: 5px solid #2980b9;
            border-radius: 4px;
            min-height: 80px;
        }
        .buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        button {
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        button:active {
            transform: scale(0.98);
        }
        .btn-start { background-color: #2ecc71; color: white; }
        .btn-start:hover { background-color: #27ae60; }
        .btn-pause { background-color: #f39c12; color: white; }
        .btn-pause:hover { background-color: #d35400; }
        .btn-reset { background-color: #95a5a6; color: white; }
        .btn-reset:hover { background-color: #7f8c8d; }
    </style>
</head>
<body>

<div class="container">
    <h1>Centro de Rutinas Adaptadas</h1>

    <div class="selector-group">
        <label for="routine-select">Selecciona una Rutina:</label>
        <select id="routine-select" onchange="switchRoutine()">
            <option value="abs">Abdominales de Pie Adaptados</option>
            <option value="kickboxing">Rutina de Kickboxing (30 min)</option>
            <option value="resistencia">Rutina de Resistencia (1:1)</option>
        </select>
    </div>

    <div id="phase" class="phase">Presiona Iniciar</div>
    <div id="timer" class="timer">00:00</div>
    <div id="exercise-title" class="exercise-title">¡Listo para empezar!</div>
    <div id="description" class="description">Cargando la rutina seleccionada...</div>
    
    <div class="buttons">
        <button class="btn-start" onclick="startTimer()">Iniciar</button>
        <button class="btn-pause" onclick="pauseTimer()">Pausar</button>
        <button class="btn-reset" onclick="resetRoutine()">Reiniciar</button>
    </div>
</div>

<script>
    const routinesData = {
        abs: {
            title: "Abdominales de Pie Adaptados",
            initialTime: "01:00",
            initialDesc: "Rutina adaptada 100% de pie sin suelo. Presiona Iniciar para comenzar con el calentamiento suave.",
            steps: [
                { phase: "Calentamiento", title: "Respiración Diafragmática", duration: 60, type: "work", desc: "De pie, inhala expandiendo el abdomen y exhala metiendo el ombligo hacia la espina." },
                { phase: "Calentamiento", title: "Balanceo de Cadera Neutro", duration: 60, type: "work", desc: "Sujétate suavemente si necesitas equilibrio. Realiza basculaciones pélvicas ligeras." },
                { phase: "Bloque 1 - Trabajo", title: "Inclinación Lateral de Costillas", duration: 45, type: "work", desc: "Desliza una mano hacia la rodilla lateralmente 2-3 cm y regresa. Alterna lados lentamente." },
                { phase: "Bloque 1 - Descanso", title: "Descanso Activo", duration: 15, type: "rest", desc: "Suelta los brazos y respira manteniendo postura erguida." },
                { phase: "Bloque 1 - Trabajo", title: "Contracción de Guardia (Core Bracing)", duration: 45, type: "work", desc: "Mete el abdomen fuertemente como si fueras a recibir un toque ligero en el vientre." },
                { phase: "Bloque 1 - Descanso", title: "Descanso Activo", duration: 15, type: "rest", desc: "Relaja la pared abdominal y recupera la postura." },
                { phase: "Enfriamiento", title: "Respiración Final", duration: 60, type: "work", desc: "Inhala elevando los brazos suavemente a los costados y exhala bajándolos para finalizar." }
            ]
        },
        kickboxing: {
            title: "Rutina de Kickboxing Adaptada",
            initialTime: "01:00",
            initialDesc: "Presiona el botón de Iniciar para comenzar con la rutina adaptada de 30 minutos.",
            steps: [
                // CALENTAMIENTO (4 min)
                { phase: "Calentamiento", title: "Hombros y Brazos", duration: 60, type: "work", desc: "Rotaciones de hombros hacia atrás y hacia adelante." },
                { phase: "Calentamiento", title: "Rotación de Cadera", duration: 60, type: "work", desc: "Manos en las caderas, haz círculos pequeños y lentos." },
                { phase: "Calentamiento", title: "Transferencia de Peso", duration: 60, type: "work", desc: "Balancea el peso de tu cuerpo de una pierna a la otra suavemente." },
                { phase: "Calentamiento", title: "Marcha Estática Baja", duration: 60, type: "work", desc: "Despega los talones del suelo uno a uno, sin levantar completamente la planta." },
                
                // TRABAJO DE BRAZOS (6 min)
                { phase: "Trabajo de Brazos", title: "El Jab y el Directo (Min 1)", duration: 60, type: "work", desc: "Lanza puñetazos frontales controlados. No extiendas el codo al 100%." },
                { phase: "Trabajo de Brazos", title: "El Jab y el Directo (Min 2)", duration: 60, type: "work", desc: "Continúa lanzando puñetazos frontales alternos de forma controlada." },
                { phase: "Trabajo de Brazos", title: "Ganchos Cortos (Min 1)", duration: 60, type: "work", desc: "Golpes laterales simulando rodear un arco. El movimiento nace del pecho." },
                { phase: "Trabajo de Brazos", title: "Ganchos Cortos (Min 2)", duration: 60, type: "work", desc: "Continúa con los ganchos laterales, manteniendo el abdomen contraído." },
                { phase: "Trabajo de Brazos", title: "Combinación Básica (Min 1)", duration: 60, type: "work", desc: "Secuencia: Jab - Directo - Gancho. Exhala con cada golpe." },
                { phase: "Trabajo de Brazos", title: "Combinación Básica (Min 2)", duration: 60, type: "work", desc: "Continúa con la secuencia rítmica lenta: Jab - Directo - Gancho." },
                
                // TRABAJO DE TORSO (6 min)
                { phase: "Trabajo de Torso", title: "Guardia Blindada (Min 1)", duration: 60, type: "work", desc: "Acerca un codo hacia tu costilla de forma lenta simulando un bloqueo bajo." },
                { phase: "Trabajo de Torso", title: "Guardia Blindada (Min 2)", duration: 60, type: "work", desc: "Continúa con el bloqueo costal lento manteniendo el core activo." },
                { phase: "Trabajo de Torso", title: "Giros Cortos de Tronco (Min 1)", duration: 60, type: "work", desc: "Realiza micro-rotaciones del pecho (10-15 grados) de lado a lado." },
                { phase: "Trabajo de Torso", title: "Giros Cortos de Tronco (Min 2)", duration: 60, type: "work", desc: "Sigue con las micro-rotaciones controladas sin forzar la zona lumbar." },
                { phase: "Trabajo de Torso", title: "Esquiva Lateral (Min 1)", duration: 60, type: "work", desc: "Desplaza tu torso sutilmente de lado a lado de forma recta." },
                { phase: "Trabajo de Torso", title: "Esquiva Lateral (Min 2)", duration: 60, type: "work", desc: "Continúa con el deslizamiento lateral para trabajar el core lateral." },
                
                // TRABAJO DE PIERNAS (6 min)
                { phase: "Trabajo de Piernas", title: "Elevación de Talón (Min 1)", duration: 60, type: "work", desc: "Eleva ligeramente el talón derecho y luego el izquierdo de forma alterna." },
                { phase: "Trabajo de Piernas", title: "Elevación de Talón (Min 2)", duration: 60, type: "work", desc: "Continúa alternando la elevación de talones." },
                { phase: "Trabajo de Piernas", title: "Patada Frontal Baja (Izq)", duration: 60, type: "work", desc: "Eleva la rodilla izquierda unos cm y extiende el pie hacia el frente abajo." },
                { phase: "Trabajo de Piernas", title: "Patada Frontal Baja (Der)", duration: 60, type: "work", desc: "Eleva la rodilla derecha unos cm y extiende el pie hacia el frente abajo." },
                { phase: "Trabajo de Piernas", title: "Rodilla al Frente (Min 1)", duration: 60, type: "work", desc: "Trae la rodilla trasera hacia el frente de forma muy baja y regresa." },
                { phase: "Trabajo de Piernas", title: "Rodilla al Frente (Min 2)", duration: 60, type: "work", desc: "Continúa con el movimiento controlado de la rodilla." },

                // TRABAJO COMBINADO (4 min)
                { phase: "Trabajo Combinado", title: "Combo Completo (Min 1)", duration: 60, type: "work", desc: "Unifica: Jab - Directo - Esquiva Lateral - Elevación de Talón." },
                { phase: "Trabajo Combinado", title: "Combo Completo (Min 2)", duration: 60, type: "work", desc: "Mantén el patrón rítmico y exhala en cada impacto." },
                { phase: "Trabajo Combinado", title: "Sombras Controladas (Min 1)", duration: 60, type: "work", desc: "Puñetazos frontales continuos a un ritmo ligeramente más activo." },
                { phase: "Trabajo Combinado", title: "Sombras Controladas (Min 2)", duration: 60, type: "work", desc: "Último minuto. Mantén la guardia alta y el abdomen firme." },
                
                // ENFRIAMIENTO (4 min)
                { phase: "Enfriamiento", title: "Respiraciones Profundas", duration: 60, type: "work", desc: "Inhala elevando los brazos suavemente y exhala bajándolos." },
                { phase: "Enfriamiento", title: "Estiramiento Pecho", duration: 60, type: "work", desc: "Lleva los hombros hacia atrás suavemente para abrir el pecho." },
                { phase: "Enfriamiento", title: "Estiramiento Isquiotibiales (Izq)", duration: 60, type: "work", desc: "Sentado, extiende una pierna e inclina el torso con espalda recta." },
                { phase: "Enfriamiento", title: "Estiramiento Isquiotibiales (Der)", duration: 60, type: "work", desc: "Sentado, extiende la otra pierna e inclina el torso." }
            ]
        },
        resistencia: {
            title: "Rutina de Resistencia (1:1)",
            initialTime: "03:00",
            initialDesc: "Rutina alternando 30 segundos de actividad con 30 segundos de descanso.",
            steps: [
                { phase: "Calentamiento", title: "Movimiento Suave", duration: 180, type: "work", desc: "Muévete suavemente en el sitio para entrar en calor." },
                { phase: "Vuelta 1", title: "Sentadillas", duration: 30, type: "work", desc: "Baja y sube de forma constante y controlada." },
                { phase: "Vuelta 1", title: "Descanso Total", duration: 30, type: "rest", desc: "Recupera el aliento." }
            ]
        }
    };

    let currentRoutineKey = "kickboxing";
    let currentStep = 0;
    let timeLeft = 0;
    let timerInterval = null;
    let isRunning = false;

    function switchRoutine() {
        const select = document.getElementById("routine-select");
        currentRoutineKey = select.value;
        resetRoutine();
    }

    function updateDisplay() {
        const routineObj = routinesData[currentRoutineKey];
        if (!routineObj || !routineObj.steps[currentStep]) return;

        const step = routineObj.steps[currentStep];
        
        document.getElementById("phase").innerText = step.phase;
        document.getElementById("exercise-title").innerText = step.title;
        document.getElementById("description").innerText = step.desc;
        
        const timerEl = document.getElementById("timer");
        timerEl.className = "timer " + (step.type === "work" ? "work" : "rest");

        let minutes = Math.floor(timeLeft / 60);
        let seconds = timeLeft % 60;
        timerEl.innerText = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    }

    function startTimer() {
        if (isRunning) return;
        
        clearInterval(timerInterval); // Previene intervalos duplicados
        isRunning = true;
        
        const routineObj = routinesData[currentRoutineKey];

        if (currentStep >= routineObj.steps.length) {
            currentStep = 0;
            timeLeft = routineObj.steps[0].duration;
        }

        updateDisplay();

        timerInterval = setInterval(() => {
            timeLeft--;
            
            if (timeLeft < 0) {
                currentStep++;
                if (currentStep < routineObj.steps.length) {
                    timeLeft = routineObj.steps[currentStep].duration;
                } else {
                    clearInterval(timerInterval);
                    isRunning = false;
                    document.getElementById("phase").innerText = "¡Rutina Completada!";
                    document.getElementById("exercise-title").innerText = "¡Excelente Trabajo!";
                    document.getElementById("description").innerText = "Has completado la rutina con éxito.";
                    document.getElementById("timer").className = "timer";
                    document.getElementById("timer").innerText = "00:00";
                    return;
                }
            }
            updateDisplay();
        }, 1000);
    }

    function pauseTimer() {
        clearInterval(timerInterval);
        isRunning = false;
    }

    function resetRoutine() {
        pauseTimer();
        currentStep = 0;
        
        const routineObj = routinesData[currentRoutineKey];
        timeLeft = routineObj.steps[0].duration;
        
        document.getElementById("phase").innerText = "Presiona Iniciar";
        document.getElementById("exercise-title").innerText = routineObj.title;
        document.getElementById("description").innerText = routineObj.initialDesc;
        
        const timerEl = document.getElementById("timer");
        timerEl.className = "timer";
        
        let minutes = Math.floor(timeLeft / 60);
        let seconds = timeLeft % 60;
        timerEl.innerText = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    }

    window.onload = function() {
        document.getElementById("routine-select").value = "kickboxing";
        resetRoutine();
    };
</script>

</body>
</html>
